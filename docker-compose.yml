services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: pulso123
      POSTGRES_DB: pulso
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulso -d pulso"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: pulso
      DB_PASSWORD: pulso123
      DB_NAME: pulso
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  datos_db:
