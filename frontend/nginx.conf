server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker: resuelve "backend" en cada peticion, asi
    # nginx arranca aunque el backend todavia no este listo.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://backend:3000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
